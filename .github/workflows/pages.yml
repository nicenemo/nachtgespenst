# Publishes this repository (the site) to the gh-pages branch, which GitHub Pages serves
# (Settings -> Pages -> Source: "Deploy from a branch", branch gh-pages, folder / (root)).
# With the account's custom domain the site appears at https://hanskruse.eu/nachtgespenst/.
name: Publish project site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: The private repository must not be named
        run: ./scripts/check-private-names.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install, lint, test and build (the site is published from dist/)
        run: |
          npm ci
          npm run check

      - name: Check out the gh-pages branch (or start it)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone --branch gh-pages --single-branch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pages
          else
            git init -b gh-pages pages
            git -C pages remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - name: Copy the site
        run: |
          find pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a dist/ pages/
          touch pages/.nojekyll

      - name: Commit and push
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "Publish site from ${GITHUB_SHA::7}"
            git push origin HEAD:gh-pages
          fi
